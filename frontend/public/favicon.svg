      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
